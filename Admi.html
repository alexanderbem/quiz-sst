.scroll{max-height:420px;overflow-y:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>Panel de la instructora · Concurso SST</h1>

  <div class="card" id="login">
    <p>Contraseña de la instructora</p>
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="off">
    <div class="row" style="margin-top:12px"><button class="btn" id="enter">Entrar</button></div>
    <div class="err" id="lerr"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div class="stats"><span class="chip" id="phase"></span><span class="chip" id="count"></span><span class="chip" id="answered"></span></div>
      <div class="row">
        <button class="btn y" id="start">Iniciar competencia</button>
        <button class="btn" id="next">Siguiente pregunta</button>
        <button class="btn r" id="reset">Reiniciar</button>
      </div>
    </div>

    <div class="card hidden" id="qcard">
      <div class="topic" id="topic"></div>
      <div class="big" id="secs"></div>
      <div class="q" id="qtext"></div>
      <div id="opts"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Tabla de posiciones</h3>
      <div class="scroll">
        <table>
          <thead><tr><th>Puesto</th><th>Usuario</th><th class="n">Puntaje</th><th class="n">Tiempo</th></tr></thead>
          <tbody id="lb"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const L = ['A', 'B', 'C', 'D'];
const PH = { lobby: 'En espera', question: 'Pregunta en curso', reveal: 'Mostrando respuesta', finished: 'Terminada' };
let pass = sessionStorage.getItem('sst_admin') || '', deadline = 0, poll = null, phase = '';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function call(path, method) {
  const r = await fetch(path, { method: method || 'GET', headers: { 'x-admin-pass': pass }, cache: 'no-store' });
  if (r.status === 401) throw new Error('auth');
  return r.json();
}

async function enter() {
  pass = $('pass').value || pass;
  try {
    render(await call('/api/state?admin=1'));
    sessionStorage.setItem('sst_admin', pass);
    $('login').classList.add('hidden'); $('panel').classList.remove('hidden');
    clearInterval(poll); poll = setInterval(refresh, 1000);
  } catch { $('lerr').textContent = 'Contraseña incorrecta.'; }
}
async function refresh() { try { render(await call('/api/state?admin=1')); } catch {} }
async function act(a) { try { render(await call('/api/admin/' + a, 'POST')); } catch {} }

$('enter').onclick = enter;
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
$('start').onclick = () => act('start');
$('next').onclick = () => act('next');
$('reset').onclick = () => { if (confirm('¿Reiniciar? Se borrarán todos los participantes y resultados.')) act('reset'); };

function render(s) {
  phase = s.phase;
  $('phase').textContent = PH[s.phase] + (s.q >= 0 && s.phase !== 'finished' ? ' · ' + (s.q + 1) + '/' + s.total : '');
  $('count').textContent = s.playerCount + ' participantes';
  $('answered').textContent = s.question ? s.answeredCount + ' respondieron' : '';
  $('answered').classList.toggle('hidden', !s.question);
  $('start').disabled = s.phase !== 'lobby';
  $('next').disabled = !(s.phase === 'question' || s.phase === 'reveal');
  $('next').textContent = s.q + 1 >= s.total ? 'Terminar' : 'Siguiente pregunta';

  $('qcard').classList.toggle('hidden', !s.question);
  if (s.question) {
    deadline = performance.now() + s.remainingMs;
    $('topic').textContent = s.question.topic;
    $('qtext').textContent = s.question.text;
    $('opts').innerHTML = s.question.options.map((o, i) => `<div class="o ${i === s.correct ? 'c' : ''}"><b>${L[i]})</b> ${esc(o)}${i === s.correct ? ' ✔' : ''}</div>`).join('');
    if (s.phase !== 'question') $('secs').textContent = '0 s';
  }
  $('lb').innerHTML = s.leaderboard.length
    ? s.leaderboard.map(p => `<tr><td>${p.rank}</td><td>${esc(p.name)}</td><td class="n">${p.score}</td><td class="n">${p.time.toFixed(1)} s</td></tr>`).join('')
    : '<tr><td colspan="4">Aún no hay participantes.</td></tr>';
}

setInterval(() => { if (phase === 'question') $('secs').textContent = Math.ceil(Math.max(0, deadline - performance.now()) / 1000) + ' s'; }, 200);

if (pass) enter();
</script>
</body>
</html>
